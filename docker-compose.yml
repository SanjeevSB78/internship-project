services:
  app:
    build: .
    ports:
      - "8081:80"
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpassword
      MYSQL_DATABASE: internship_db
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MONGO_HOST: mongodb
      MONGO_PORT: "27017"
    depends_on:
      - mysql
      - mongodb
      - redis

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: internship_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

  mongodb:
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7
    ports:
      - "6380:6379"

volumes:
  mysql_data:
  mongodb_data: