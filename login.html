<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="auth-shell">
        <aside class="auth-aside">
            <a href="index.html" class="brand"><span class="brand-mark">IP</span>Internship Project</a>
            <div>
                <h1>Welcome back.</h1>
                <p>Sign in to view and manage your profile details.</p>
            </div>
            <small>&copy; Internship Project</small>
        </aside>

        <main class="auth-main">
            <div class="auth-box">

                <h2>Sign in</h2>
                <p class="lead-text">Enter your credentials to access your account.</p>

                <div id="loginForm">

                    <div class="mb-3">
                        <label for="username" class="form-label">
                            Username
                        </label>

                        <input
                            type="text"
                            id="username"
                            class="form-control"
                            autocomplete="username"
                        >
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            class="form-control"
                            autocomplete="current-password"
                        >
                    </div>

                    <button
                        type="button"
                        id="loginBtn"
                        class="btn btn-primary w-100"
                    >
                        Login
                    </button>

                </div>

                <div class="auth-alt">
                    <span>Don't have an account?</span>
                    <a href="register.html">Register</a>
                </div>

            </div>
        </main>
        <footer class="landing-credit">
    Built by <span class="code-mark">&lt;/&gt;</span>
    <strong>Sanjeev</strong>
    · <a href="https://github.com/SanjeevSB78"
         target="_blank" rel="noopener noreferrer">GitHub</a>
    · <a href="https://www.linkedin.com/in/sanjeev-sb-b49b4831a/"
         target="_blank" rel="noopener noreferrer">LinkedIn</a>
</footer>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/login.js"></script>

</body>

</html>
