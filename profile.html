<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand mb-0 h1">
                Internship Project
            </span>

            <button
                type="button"
                id="logoutBtn"
                class="btn btn-outline-light btn-sm"
            >
                Logout
            </button>
        </div>
    </nav>

    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-12 col-md-8 col-lg-6">

                <div class="card shadow-sm">

                    <div class="card-body p-4">

                        <h2 class="text-center mb-4">
                            My Profile
                        </h2>

                        <div id="profileForm">

                            <div class="mb-3">
                                <label
                                    for="age"
                                    class="form-label"
                                >
                                    Age
                                </label>

                                <input
                                    type="number"
                                    id="age"
                                    class="form-control"
                                    min="1"
                                    max="120"
                                >
                            </div>

                            <div class="mb-3">
                                <label
                                    for="dob"
                                    class="form-label"
                                >
                                    Date of Birth
                                </label>

                                <input
                                    type="date"
                                    id="dob"
                                    class="form-control"
                                >
                            </div>

                            <div class="mb-3">
                                <label
                                    for="contact"
                                    class="form-label"
                                >
                                    Contact
                                </label>

                                <input
                                    type="text"
                                    id="contact"
                                    class="form-control"
                                >
                            </div>

                            <button
                                type="button"
                                id="saveProfileBtn"
                                class="btn btn-primary w-100"
                            >
                                Save Profile
                            </button>

                        </div>

                        <div
                            id="message"
                            class="alert alert-info mt-3 mb-0"
                            style="display: none;"
                        ></div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/profile.js"></script>

</body>

</html>
