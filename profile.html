<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="topbar">
        <div class="container">
            <a href="index.html" class="brand"><span class="brand-mark">IP</span>Internship Project</a>

            <button
                type="button"
                id="logoutBtn"
                class="btn btn-ghost"
            >
                Logout
            </button>
        </div>
    </header>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-9 col-lg-6">

                <div class="page-head">
                    <h2>My profile</h2>
                    <p>Keep your personal details up to date.</p>
                </div>

                <div class="panel">
                    <div class="panel-head">
                        <h3>Personal details</h3>
                        <p>These details are saved to your account.</p>
                    </div>

                    <div class="panel-body">

                        <div id="profileForm">

                            <div class="mb-3">
                                <label for="age" class="form-label">
                                    Age
                                </label>

                                <input
                                    type="number"
                                    id="age"
                                    class="form-control"
                                    min="1"
                                    max="120"
                                >
                            </div>

                            <div class="mb-3">
                                <label for="dob" class="form-label">
                                    Date of Birth
                                </label>

                                <input
                                    type="date"
                                    id="dob"
                                    class="form-control"
                                >
                            </div>

                            <div class="mb-3">
                                <label for="contact" class="form-label">
                                    Contact
                                </label>

                                <input
                                    type="text"
                                    id="contact"
                                    class="form-control"
                                >
                            </div>

                            <button
                                type="button"
                                id="saveProfileBtn"
                                class="btn btn-primary w-100"
                            >
                                Save Profile
                            </button>

                        </div>

                        <div
                            id="message"
                            class="alert alert-info mt-3 mb-0"
                            style="display: none;"
                        ></div>

                    </div>
                </div>

            </div>
        </div>
    </main>

    <footer class="landing-credit">
    Built by <span class="code-mark">&lt;/&gt;</span>
    <strong>Sanjeev</strong>
    · <a href="https://github.com/SanjeevSB78"
         target="_blank" rel="noopener noreferrer">GitHub</a>
    · <a href="https://www.linkedin.com/in/sanjeev-sb-b49b4831a/"
         target="_blank" rel="noopener noreferrer">LinkedIn</a>
</footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/profile.js"></script>

</body>

</html>
